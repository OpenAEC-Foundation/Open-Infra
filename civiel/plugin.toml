[plugin]
id = "openaec.open-infra-civiel"
name = "Open Infra — Civiel"
version = "2026.44.3"
description = "Civiele ontwerptools: meetpunten (PNEZD, LandXML), terrein (TIN, hoogtelijnen, hoogteanalyse, grondverzet), assen met stationering, lengte-, ontwerp- en dwarsprofielen. Op NLCS-lagen, over AHN of een eigen TIN."
author = "OpenAEC Foundation"
license = "GPL-3.0-only"
repository = "OpenAEC-Foundation/Open-Infra-Studio"

[opencad]
api_version = 13
# Filled at build time (scripts/install.sh, release workflow), like the GIS plugin.
rustc_version = "__RUSTC_VERSION__"
acadrust_source = "__ACADRUST_SOURCE__"
ribbon_order = 61
command_prefixes = ["CIV_"]
xdata_apps = ["OPENINFRA"]

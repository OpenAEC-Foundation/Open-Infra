[package]
name = "open-infra"
version = "2026.44.2"
edition = "2021"
description = "Open Infra — GIS-workbench voor Open CAD Studio (infra en civiele techniek, NL en wereldwijd)."
license = "GPL-3.0-only"
repository = "https://github.com/OpenAEC-Foundation/Open-Infra"

[lib]
# cdylib: the plugin the host loads; rlib: lets `cargo test` link the engine.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Stable host contract, pinned to the Open CAD Studio v2026.42 release (API 10).
# Pin the commit of the Open CAD Studio release you target:
# it also pins the opencadcodec revision, and the host only loads a plugin built
# against the same opencadcodec commit and rustc.
ocs_plugin_api = { git = "https://github.com/HakanSeven12/OpenCADStudio", rev = "b6fbac39ffc74398ba5d283ce2bc1dc07a8fd8f0", features = ["host"] }

# GIS engine
proj4rs = "0.2"
ureq = "3"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# KLIC (IMKL 2.0) reader from the OpenAEC crates warehouse (MIT)
klic2geo = { git = "https://github.com/OpenAEC-Foundation/crates-warehouse" }
# Local date for the title block
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# AHN: height grids (WCS GeoTIFF float32) and point clouds (COPC)
tiff = "0.11"
copc-rs = "0.5"
# Local GIS files: Shapefile, GeoPackage (SQLite, built in), KMZ (zip)
shapefile = "0.9"
rusqlite = { version = "0.41", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

# Workbench window (runs in the plugin process, beside the host)
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
winit = "0.30"
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }

[profile.release]
opt-level = 3

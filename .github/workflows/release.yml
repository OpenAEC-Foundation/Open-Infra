name: release

# Build the plugin for each desktop platform and attach the binaries plus
# plugin.toml to a GitHub Release on a v* tag. Open CAD Studio's Plugin Manager
# picks the asset for the user's platform and installs it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Must equal the rustc that built the Open CAD Studio release this plugin
  # targets: the host compares plugin.toml's rustc_version byte for byte.
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lib: libopen_infra.so
            asset: openaec.open-infra-linux-x86_64.so
          - os: windows-latest
            lib: open_infra.dll
            asset: openaec.open-infra-windows-x86_64.dll
          - os: macos-latest
            lib: libopen_infra.dylib
            asset: openaec.open-infra-macos-aarch64.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo test --lib
      - run: cargo build --release
      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.lib }}" "dist/${{ matrix.asset }}"
          acadrust_source=$(awk '/^name = "acadrust"$/{f=1} f&&/^source = /{gsub(/^source = "|"$/,""); print; exit}' Cargo.lock)
          sed -e "s|__RUSTC_VERSION__|$(rustc --version)|" -e "s|__ACADRUST_SOURCE__|$acadrust_source|" plugin.toml > dist/plugin.toml
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/${{ matrix.asset }}
            dist/plugin.toml

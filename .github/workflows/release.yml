name: release

# Build the plugin for each desktop platform and attach the binaries plus
# plugin.toml to a GitHub Release on a v* tag. Open CAD Studio's Plugin Manager
# picks the asset for the user's platform and installs it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Must equal the rustc that built the Open CAD Studio release this plugin
  # targets: the host compares plugin.toml's rustc_version byte for byte.
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04   # same image as the host AppImage: glibc 2.35 runs on older distros too
            lib: libopen_infra.so
            civiel: libopen_infra_civiel.so
            asset: openaec.open-infra-linux-x86_64.so
            zip: open-infra-civiel-linux-x86_64.zip
            # plugin.toml is identical for every platform; one job ships it.
            toml: dist/plugin.toml
          - os: windows-latest
            lib: open_infra.dll
            civiel: open_infra_civiel.dll
            asset: openaec.open-infra-windows-x86_64.dll
            zip: open-infra-civiel-windows-x86_64.zip
          - os: macos-14       # Apple Silicon, as the host release
            lib: libopen_infra.dylib
            civiel: libopen_infra_civiel.dylib
            asset: openaec.open-infra-macos-aarch64.dylib
            zip: open-infra-civiel-macos-aarch64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo test --lib --locked -p open-infra
      # Two plugins from one engine: separate builds, so the Civiel plugin
      # links the engine without the GIS plugin's entry points. That second
      # build rewrites target/release/<gis lib> without them, so copy the GIS
      # library before it runs.
      - run: cargo build --release --locked -p open-infra
      - name: Stage the GIS library
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.lib }}" "dist/${{ matrix.asset }}"
      - run: cargo build --release --locked -p open-infra-civiel
      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p civiel-pkg/openaec.open-infra-civiel
          acadrust_source=$(awk '/^name = "acadrust"$/{f=1} f&&/^source = /{gsub(/^source = "|"$/,""); print; exit}' Cargo.lock)
          stamp() { sed -e "s|__RUSTC_VERSION__|$(rustc --version)|" -e "s|__ACADRUST_SOURCE__|$acadrust_source|" "$1"; }
          stamp plugin.toml > dist/plugin.toml
          # The Civiel plugin as a folder for <config>/OpenCADStudio/plugins/.
          cp "target/release/${{ matrix.civiel }}" civiel-pkg/openaec.open-infra-civiel/
          stamp civiel/plugin.toml > civiel-pkg/openaec.open-infra-civiel/plugin.toml
          cd civiel-pkg
          if command -v zip >/dev/null; then zip -qr "../dist/${{ matrix.zip }}" openaec.open-infra-civiel; else 7z a -tzip "../dist/${{ matrix.zip }}" openaec.open-infra-civiel >/dev/null; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Open Infra ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.zip }}
            ${{ matrix.toml }}

name: Bestaande macOS-releases ondertekenen en notarizen
on:
  push:
    branches: [codex/ecosystem-signature-audit-20261029]
    paths: ['tools/signature-audit/macos-signing-manifest.json', 'tools/signature-audit/macos_sign_release.py', '.github/workflows/ecosystem-macos-signing.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      assets: ${{ steps.assets.outputs.json }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: assets
        run: echo "json=$(jq -c . tools/signature-audit/macos-signing-manifest.json)" >> "$GITHUB_OUTPUT"
  sign:
    needs: matrix
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        asset: ${{ fromJSON(needs.matrix.outputs.assets) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configureer bestaande Apple Developer ID en notarization
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY_CONTENT APPLE_API_KEY APPLE_API_ISSUER; do
            test -n "${!name}" || { echo "Bestaande organisatiecredential niet beschikbaar: $name"; exit 1; }
          done
          password=$(openssl rand -base64 32)
          echo "::add-mask::$password"
          keychain="$RUNNER_TEMP/openaec-release-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/openaec-release.p12"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/openaec-notary.p8"
          chmod 600 "$RUNNER_TEMP/openaec-notary.p8" "$RUNNER_TEMP/openaec-release.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/openaec-release.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/openaec-notary.p8" >> "$GITHUB_ENV"
      - name: Onderteken en laat Apple het pakket beoordelen
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_ASSET_JSON: ${{ toJSON(matrix.asset) }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: python3 tools/signature-audit/macos_sign_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-signed-${{ matrix.asset.asset_id }}
          path: macos-signing/output/
          if-no-files-found: warn
      - name: Verwijder tijdelijke credentials
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/openaec-release-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/openaec-release.p12" "$RUNNER_TEMP/openaec-notary.p8"
